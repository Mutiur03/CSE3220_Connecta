name: deploy
on:
  push:
    branches: [main]
# One deploy at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B test
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  # The VPS does not exist until the secrets are added. Without them the image build and the deploy are skipped
  # (green, with a notice) so CI stays usable. Secrets cannot be read in `if`, so this job turns them into an output.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing secret:VPS_HOST"
          [ -n "$VPS_USER" ] || missing="$missing secret:VPS_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing secret:VPS_SSH_KEY"
          [ -n "$NEXT_PUBLIC_API_URL" ] || missing="$missing variable:NEXT_PUBLIC_API_URL"
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped, not configured yet. Missing:$missing. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: [test, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6.10.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-backend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6.10.0
        with:
          context: frontend
          push: true
          # Baked into the browser bundle: the public API address (https://<API_DOMAIN>).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-frontend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ vars.VPS_DIR || '/opt/connecta' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set, trusting the host key seen now. Pin it for stricter checking."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port $VPS_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
      - name: Copy deploy files
        run: |
          scp deploy/docker-compose.prod.yml deploy/docker-compose.monitoring.yml deploy/Caddyfile             scripts/deploy-remote.sh scripts/backup-postgres.sh scripts/restore-postgres.sh "vps:$VPS_DIR/"
          ssh vps "mkdir -p '$VPS_DIR/prometheus' '$VPS_DIR/grafana/provisioning' && chmod +x '$VPS_DIR'/*.sh"
          scp ops/prometheus/prometheus.prod.yml ops/prometheus/alerts.yml "vps:$VPS_DIR/prometheus/"
          scp ops/grafana/connecta-dashboard.json "vps:$VPS_DIR/grafana/"
          scp -r ops/grafana/provisioning/. "vps:$VPS_DIR/grafana/provisioning/"
      - name: Log the server in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Deploy (rolls back to the previous tag when unhealthy)
        run: ssh vps "cd '$VPS_DIR' && ./deploy-remote.sh '${{ github.sha }}'"
