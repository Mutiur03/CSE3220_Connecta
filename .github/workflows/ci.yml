name: ci
# Every PR and every push to develop/main runs the tests (PRs also check commit messages and the compose file).
# Only a push to main goes on to build the images and deploy to the VPS.
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test
      # Docker-backed tests use @Testcontainers(disabledWithoutDocker = true): without Docker they skip
      # silently. Locally that is fine; in CI a skipped test means the guarantee was not checked.
      - name: Fail if any test was skipped
        run: |
          skipped=$(grep -ho '<testsuite [^>]*' target/surefire-reports/TEST-*.xml | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*' | awk '{n+=$1} END{print n+0}')
          echo "skipped tests: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) were skipped (Docker unavailable?). CI must run every test."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build # also type-checks

  # Pull requests only. Backstop for the local commit-msg hook (hooks can be skipped): checks message format.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # Pull requests only. docker-compose.yml must stay valid with the documented example settings.
  compose:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet

  # The VPS does not exist until the secrets are added. Without them the image build and the deploy are skipped
  # (green, with a notice) so CI stays usable. Secrets cannot be read in `if`, so this job turns them into an output.
  gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          VPS_HOST: ${{ secrets.SSH_HOST }}
          VPS_USER: ${{ secrets.SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: |
          missing=""
          [ -n "$VPS_HOST" ] || missing="$missing secret:SSH_HOST"
          [ -n "$VPS_USER" ] || missing="$missing secret:SSH_USER"
          [ -n "$VPS_SSH_KEY" ] || missing="$missing secret:SSH_PRIVATE_KEY"
          [ -n "$NEXT_PUBLIC_API_URL" ] || missing="$missing variable:NEXT_PUBLIC_API_URL"
          if [ -n "$missing" ]; then
            echo "::notice::Deploy skipped, not configured yet. Missing:$missing. See docs/deployment.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  images:
    needs: [backend, frontend, gate]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.7.1
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6.10.0
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-backend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6.10.0
        with:
          context: frontend
          push: true
          # Baked into the browser bundle: the public API address (https://<API_DOMAIN>).
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-frontend:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/connecta-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of cancelling a running deploy.
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.SSH_HOST }}
      VPS_USER: ${{ secrets.SSH_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_DIR: ${{ vars.VPS_DIR || '/opt/connecta' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          VPS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            echo "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set, trusting the host key seen now. Pin it for stricter checking."
            ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          {
            echo "Host vps"
            echo "  HostName $VPS_HOST"
            echo "  User $VPS_USER"
            echo "  Port $VPS_PORT"
            echo "  IdentityFile ~/.ssh/id_deploy"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
      # The only thing set up by hand on the server is /opt/connecta/.env. The compose file and Caddyfile come from this
      # commit, the images from GHCR; then pull and restart.
      - name: Deploy
        env:
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh vps "mkdir -p '$VPS_DIR'"
          scp deploy/docker-compose.prod.yml deploy/Caddyfile "vps:$VPS_DIR/"
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh vps "cd '$VPS_DIR' && export IMAGE_TAG='$TAG' && docker compose --env-file .env -f docker-compose.prod.yml pull && docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans"
