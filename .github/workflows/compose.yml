name: compose
on:
  pull_request:
    paths: ["docker-compose.yml", "backend/.env.example", "frontend/**", ".github/workflows/compose.yml"]
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
