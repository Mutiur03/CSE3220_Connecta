services:
  postgres:
    image: postgres:17-alpine
    container_name: connecta-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connecta}
      POSTGRES_USER: ${POSTGRES_USER:-connecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    container_name: connecta-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-connecta}
      DB_USER: ${POSTGRES_USER:-connecta}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Invitation email. Blank SMTP_HOST sends nothing. None of these is a secret except SMTP_PASSWORD.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-connecta@localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Local mail catcher for invitation emails. Start it with: docker compose --profile dev up
  # Then set SMTP_HOST=mailpit and SMTP_PORT=1025 in .env. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: connecta-mailpit
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
    container_name: connecta-frontend
    environment:
      # Server-side calls use the service address; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://app:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
