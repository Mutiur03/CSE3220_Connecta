services:
  # Credentials and settings come from backend/.env (copy backend/.env.example). Compose does not read a root .env.
  postgres:
    image: postgres:17-alpine
    container_name: connecta-postgres
    env_file: ./backend/.env
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./backend
      args:
        # Session location database baked into the image. Blank downloads DB-IP City Lite; a link uses your own
        # file (for example a MaxMind download); "none" skips it.
        GEOIP_DB_URL: ${GEOIP_DB_URL:-}
    container_name: connecta-app
    env_file: ./backend/.env
    # Overrides backend/.env: compose runs with production settings and reaches the database by service name.
    environment:
      SWAGGER_ENABLED: "false"
      S3_REQUIRED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/connecta
      SPRING_FLYWAY_ENABLED: "true"
      GEOIP_DB_PATH: /opt/geoip/GeoLite2-City.mmdb
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Local mail catcher for invitation emails. Start it with: docker compose --profile dev up
  # Then set SMTP_HOST=mailpit and SMTP_PORT=1025 in backend/.env. Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: connecta-mailpit
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"

  # Local S3 for product images. Start it with: docker compose --profile dev up
  # Then in backend/.env set S3_ENDPOINT=http://localhost:9000, S3_REGION=us-east-1, S3_BUCKET=connecta,
  # S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY equal to MINIO_ROOT_USER and MINIO_ROOT_PASSWORD,
  # S3_PATH_STYLE_ACCESS=true, S3_PUBLIC_BASE_URL=http://localhost:9000/connecta. Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: connecta-minio
    profiles: ["dev"]
    env_file: ./backend/.env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the S3_BUCKET bucket and makes its objects publicly readable (images are served by URL).
  minio-init:
    image: minio/mc:latest
    container_name: connecta-minio-init
    profiles: ["dev"]
    env_file: ./backend/.env
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET"

  frontend:
    build:
      context: ./frontend
      args:
        # Public backend URL, baked into the image at build time. Set it in the shell to change it, for example
        # NEXT_PUBLIC_API_URL=https://api.example.com docker compose up --build. Not a secret.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: connecta-frontend
    environment:
      # Server-side calls use the service address; the browser uses NEXT_PUBLIC_API_URL.
      API_URL: http://app:8080
    ports:
      - "3000:3000"
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
