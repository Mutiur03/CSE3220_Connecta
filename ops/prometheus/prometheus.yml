global:
  scrape_interval: 15s

scrape_configs:
  - job_name: connecta-backend
    metrics_path: /actuator/prometheus
    # /actuator/prometheus needs an ADMIN access token. Mount it as a file; never commit it.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets: ["backend:8080"]
