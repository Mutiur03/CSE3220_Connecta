# Optional monitoring stack: Prometheus, Grafana and node-exporter, on the same internal network as the app.
# Optional. Used NEXT TO the main file, started by hand on the server (see docs/operations.md):
#   docker compose --env-file .env -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# Nothing here is published to the internet. Grafana listens on 127.0.0.1:3001 of the server only (SSH tunnel:
# ssh -L 3001:127.0.0.1:3001 deploy@<host>, then open http://localhost:3001). The deploy workflow copies the config
# files next to this file: ops/prometheus/* -> ./prometheus and ops/grafana/* -> ./grafana.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?set METRICS_SCRAPE_TOKEN}

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: connecta-prometheus
    restart: unless-stopped
    environment:
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:?set METRICS_SCRAPE_TOKEN}
    # The token goes from the environment into a file inside the container (the config reads it from there).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf %s "$$METRICS_SCRAPE_TOKEN" > /tmp/scrape-token &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
        --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on: [app]
    networks: [connecta]
    logging: *logging

  grafana:
    image: grafana/grafana:11.4.0
    container_name: connecta-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/connecta-dashboard.json:/var/lib/grafana/dashboards/connecta-dashboard.json:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [connecta]
    logging: *logging

  # Host CPU, memory and disk (the disk alert uses it). Reads the host root read-only; no published port.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: connecta-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks: [connecta]
    logging: *logging

volumes:
  prometheus-data:
  grafana-data:
