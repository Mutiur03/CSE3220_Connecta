# Tests never touch a database or run migrations (the Testcontainers test overrides this).
# app.jwt.secret is generated per run by RandomJwtSecret.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

app.cors.allowed-origins=http://localhost:3000

app.jwt.issuer=connecta
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d
app.invitations.ttl=7d

# Meta: fake app values and a fixed test key (base64 of 32 bytes). Tests stub the Graph API, so nothing is called.
app.meta.app-id=test-app-id
app.meta.app-secret=test-app-secret
app.meta.graph-version=v26.0
app.meta.config-id=test-config-id
app.meta.base-url=http://localhost:8080
app.meta.token-encryption-key=dGVzdC1vbmx5LW1ldGEtdG9rZW4ta2V5LTAwMDAwMDE=
app.meta.instagram.app-id=test-instagram-app-id
app.meta.instagram.app-secret=test-instagram-app-secret

# No SMTP host: the no-op mailer is used and nothing is sent.
app.mail.from=connecta@test.local
app.mail.frontend-url=http://localhost:3000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
