# Local defaults, matching docker-compose.yml. Any value can be overridden by an environment variable.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connecta}
spring.datasource.username=${DB_USER:connecta}
spring.datasource.password=${DB_PASSWORD:connecta}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Dev-only secret. Never use it outside local development.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

# Dev-only Meta token key (base64 of 32 bytes). Never use it outside local development.
app.meta.token-encryption-key=${META_TOKEN_KEY:ZGV2LW9ubHktbWV0YS10b2tlbi1rZXktMDAwMDAwMDE=}

# Session location: the file `pnpm geoip` downloads. Missing file means no location, not an error.
app.geoip.database-path=${GEOIP_DB_PATH:geoip/GeoLite2-City.mmdb}

# Mailpit (docker compose, profile "dev"): SMTP on 1025, inbox at http://localhost:8025.
app.mail.host=${SMTP_HOST:localhost}
app.mail.port=${SMTP_PORT:1025}
app.mail.starttls=${SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:connecta@localhost}
app.mail.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
