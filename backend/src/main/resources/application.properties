spring.application.name=backend
# Local development by default. Production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# No defaults here: every environment must provide these (dev profile supplies local ones).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Browser origins allowed to call the API (comma separated). No default outside dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Token settings. The secret has no default here: dev supplies one, prod must set JWT_SECRET (32+ bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=connecta
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# How long an organization invitation can be accepted.
app.invitations.ttl=7d

# Invitation email. SMTP_HOST blank means no email is sent (the invite is still created and the link is
# shown to the admin). MAIL_FROM and FRONTEND_URL have no default here: prod must set them.
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USER:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.starttls=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM}
# Public address of the web app, used to build the link in the invitation email.
app.mail.frontend-url=${FRONTEND_URL}
# A mail server outage must not turn /actuator/health (and the Docker healthcheck) red.
management.health.mail.enabled=false

# Never put exception messages, stack traces or binding errors in an error body, in any profile.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
