spring.application.name=backend
# Local development by default. Production sets SPRING_PROFILES_ACTIVE=prod.
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# No defaults here: every environment must provide these (dev profile supplies local ones).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Browser origins allowed to call the API (comma separated). No default outside dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Token settings. The secret has no default here: dev supplies one, prod must set JWT_SECRET (32+ bytes).
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=connecta
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=7d

# How long an organization invitation can be accepted.
app.invitations.ttl=7d

# Invitation email. SMTP_HOST blank means no email is sent (the invite is still created and the link is
# shown to the admin). MAIL_FROM and FRONTEND_URL have no default here: prod must set them.
app.mail.host=${SMTP_HOST:}
app.mail.port=${SMTP_PORT:587}
app.mail.username=${SMTP_USER:}
app.mail.password=${SMTP_PASSWORD:}
app.mail.starttls=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM}
# Public address of the web app, used to build the link in the invitation email.
app.mail.frontend-url=${FRONTEND_URL}
# Where the browser goes after a Meta callback (the Integrations page).
app.frontend.url=${FRONTEND_URL:}
# Product image storage on any S3-compatible service (AWS S3, Cloudflare R2, MinIO, ...). Bucket, both keys and the
# public base URL must all be set to use S3; blank means the in-memory store (dev). S3_ENDPOINT is blank for AWS.
# Prod sets app.storage.s3.required=true, so it refuses to start without them.
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.access-key-id=${S3_ACCESS_KEY_ID:}
app.storage.s3.secret-access-key=${S3_SECRET_ACCESS_KEY:}
app.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.storage.s3.required=false
# A mail server outage must not turn /actuator/health (and the Docker healthcheck) red.
management.health.mail.enabled=false

# Never put exception messages, stack traces or binding errors in an error body, in any profile.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Meta connection (Facebook Login for Business). The app settings are optional: blank means the Meta features answer
# 503. META_TOKEN_KEY is required everywhere (no default here; dev supplies one): 32 random bytes, base64 encoded.
# APP_BASE_URL is this backend's public address; Meta redirects to APP_BASE_URL + /api/meta/oauth/callback.
app.meta.app-id=${META_APP_ID:}
app.meta.app-secret=${META_APP_SECRET:}
app.meta.graph-version=${META_GRAPH_API_VERSION:}
app.meta.config-id=${META_MESSENGER_CONFIG_ID:}
app.meta.base-url=${APP_BASE_URL:}
app.meta.token-encryption-key=${META_TOKEN_KEY}
app.meta.instagram.app-id=${META_INSTAGRAM_APP_ID:}
app.meta.instagram.app-secret=${META_INSTAGRAM_APP_SECRET:}
# Verify token Meta sends back when it subscribes the webhook. Blank refuses every subscription.
app.meta.webhook.verify-token=${META_WEBHOOK_VERIFY_TOKEN:}

# Product image uploads: largest file and most images per product. The multipart limits sit at or just above the
# file limit so an oversize upload is rejected as 413 before it is buffered.
app.product-images.max-size-bytes=5242880
app.product-images.max-per-product=8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
