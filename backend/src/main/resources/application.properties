spring.application.name=backend
management.endpoints.web.exposure.include=health

# Local dev defaults match docker-compose.yml. Real environment settings come with SETUP-04.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/connecta}
spring.datasource.username=${DB_USER:connecta}
spring.datasource.password=${DB_PASSWORD:connecta}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
