# No defaults: startup fails if DB_URL, DB_USER, DB_PASSWORD, MAIL_FROM or FRONTEND_URL is missing.
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never

# Product images must live in R2: startup fails when R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY or R2_PUBLIC_BASE_URL is missing.
app.storage.r2.required=true

# API docs are for development only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
