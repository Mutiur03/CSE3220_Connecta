# No defaults: startup fails if DB_URL, DB_USER, DB_PASSWORD, MAIL_FROM or FRONTEND_URL is missing.
management.endpoint.health.show-details=never
server.error.include-stacktrace=never
server.error.include-message=never

# Product images must live in S3-compatible storage: startup fails when S3_BUCKET, S3_ACCESS_KEY_ID,
# S3_SECRET_ACCESS_KEY or S3_PUBLIC_BASE_URL is missing. S3_ENDPOINT is optional (blank means AWS).
app.storage.s3.required=true

# API docs are for development only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
